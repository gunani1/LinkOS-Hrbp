<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>组织架构 · 演示（d3-org-chart）</title>
<style>
  :root{
    --bg:#F4F6F9; --card:#FFFFFF; --ink:#14181F; --muted:#6B7280; --line:#E3E7EE;
    --brand:#1F5F8B; --brand2:#2E8B8B; --root:#111827; --sys:#1E3A5F;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  html{overflow:hidden}
  body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
  header{height:60px;display:flex;align-items:center;gap:12px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);position:relative;z-index:6}
  header h1{font-size:15px;margin:0;font-weight:600;white-space:nowrap}
  header .sub{font-size:11px;color:var(--muted);white-space:nowrap}
  .demo-tag{font-size:10px;color:#8A5A00;background:#FFF4D6;border:1px solid #F0D9A0;border-radius:3px;padding:1px 6px;letter-spacing:.08em}
  .stats{display:flex;gap:14px;margin-left:4px}
  .stat b{font-size:16px;font-variant-numeric:tabular-nums}
  .stat span{font-size:10.5px;color:var(--muted);margin-left:3px}
  .spacer{flex:1}
  select,input{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:7px;padding:7px 10px;background:#FBFCFE;outline:none;color:var(--ink)}
  select:focus,input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(31,95,139,.12)}
  .search input{width:200px}
  .btns{display:flex;gap:7px}
  #btnTree{display:none}
  button{padding:7px 11px;border:1px solid var(--line);background:#fff;border-radius:7px;font:inherit;font-size:12px;cursor:pointer;color:var(--ink);white-space:nowrap}
  button:hover{border-color:var(--brand);color:var(--brand)}
  main{display:flex;height:calc(100% - 60px);position:relative}
  aside{width:230px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column}
  aside .hd{padding:12px 14px;font-size:11px;letter-spacing:.14em;color:var(--muted);border-bottom:1px solid var(--line)}
  #tree{flex:1;overflow:auto;padding:8px 8px 16px}
  .t-item{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12.5px;color:var(--ink)}
  .t-item:hover{background:#F2F6FA}
  .t-item.active{background:rgba(31,95,139,.09);color:var(--brand);font-weight:600}
  .t-item .c{margin-left:auto;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .t-l1{padding-left:8px;font-weight:600;margin-top:6px}
  .t-l2{padding-left:22px}
  .t-l3{padding-left:38px;color:#374151}
  .t-inactive{color:#9CA3AF;text-decoration:line-through}
  aside .ft{padding:10px 14px;border-top:1px solid var(--line);font-size:10.5px;color:var(--muted);line-height:1.6}
  .stage{position:relative;flex:1;min-width:0}
  #chart{width:100%;height:100%;overflow:hidden}
  #chart svg{overflow:hidden!important}
  .node{font-family:inherit}
  .n-root{background:var(--root);color:#fff;border-radius:12px;padding:14px 18px;height:100%;display:flex;flex-direction:column;justify-content:center;box-shadow:0 10px 24px rgba(17,24,39,.25)}
  .n-root .k{font-size:10px;letter-spacing:.18em;opacity:.65}
  .n-root .t{font-size:17px;font-weight:700;margin-top:2px}
  .n-sys{background:linear-gradient(135deg,var(--sys),#2B5580);color:#fff;border-radius:10px;padding:10px 13px;height:100%;display:flex;flex-direction:column;justify-content:center;box-shadow:0 6px 16px rgba(30,58,95,.22)}
  .n-sys .t{font-size:14px;font-weight:600}
  .n-sys .c{font-size:10.5px;opacity:.75;margin-top:2px}
  .n-dept{background:#fff;border:1px solid var(--line);border-left:3px solid var(--brand2);border-radius:9px;padding:7px 10px;height:100%;display:flex;flex-direction:column;justify-content:center;box-shadow:0 2px 8px rgba(20,24,31,.06);overflow:hidden}
  .n-dept .t{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .n-dept .c{font-size:10.5px;color:var(--muted);margin-top:1px}
  .n-dept.muted{opacity:.55}
  .n-person{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 10px;height:100%;display:flex;align-items:center;gap:8px;box-shadow:0 2px 8px rgba(20,24,31,.05);cursor:pointer}
  .n-person:hover{border-color:var(--brand);box-shadow:0 6px 18px rgba(31,95,139,.16)}
  .avatar{width:29px;height:29px;border-radius:50%;background:linear-gradient(135deg,#2E8B8B,#1F5F8B);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;flex-shrink:0}
  .n-person .meta{min-width:0}
  .n-person .nm{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .n-person .ps{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .n-person .tag{display:inline-block;font-size:9px;color:var(--brand);background:rgba(31,95,139,.08);border-radius:3px;padding:0 3px;margin-left:3px;vertical-align:1px}
  /* 删除展开小圆点：卡片点击即可下钻，避免有的有、有的没有 */
  g.node-button-g{display:none}
  .drawer{position:absolute;top:14px;right:14px;width:310px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 44px rgba(17,24,39,.16);padding:18px;z-index:5;transform:translateX(340px);transition:transform .22s ease;opacity:0}
  .drawer.on{transform:none;opacity:1}
  .drawer .close{position:absolute;top:10px;right:10px;border:0;background:transparent;font-size:18px;line-height:1;color:var(--muted);cursor:pointer;padding:4px}
  .drawer .top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .drawer .top .avatar{width:46px;height:46px;font-size:18px}
  .drawer h3{margin:0;font-size:16px}
  .drawer .role{font-size:11.5px;color:var(--muted);margin-top:2px}
  .kv{display:grid;grid-template-columns:76px 1fr;gap:6px 10px;font-size:12px;line-height:1.6}
  .kv .k{color:var(--muted)}
  .drawer .note{margin-top:14px;padding-top:10px;border-top:1px solid var(--line);font-size:10.5px;color:var(--muted);line-height:1.6}
  .legend{position:absolute;left:16px;bottom:14px;display:flex;gap:12px;font-size:10.5px;color:var(--muted);background:rgba(255,255,255,.86);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:8px;padding:7px 11px;z-index:4}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
  .hint{position:absolute;right:16px;bottom:14px;font-size:10.5px;color:var(--muted);z-index:4}
  @media (max-width:760px){
    header{flex-wrap:wrap;height:auto;padding:9px 12px;gap:8px}
    .stats{display:none}
    .search input{width:130px}
    main{height:calc(100% - 96px)}
    #btnTree{display:inline-block}
    aside{position:absolute;left:0;top:0;bottom:0;z-index:9;transform:translateX(-100%);transition:transform .2s ease;box-shadow:0 0 0 rgba(0,0,0,0)}
    aside.open{transform:none;box-shadow:14px 0 34px rgba(17,24,39,.18)}
    .drawer{width:calc(100% - 28px);top:auto;bottom:12px;right:14px}
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>组织架构图 <span class="demo-tag">演示</span></h1>
    <div class="sub">数据来自 10 月花名册 · 在职与异动</div>
  </div>
  <div class="stats">
    <div class="stat"><b id="s1">-</b><span>在册</span></div>
    <div class="stat"><b id="s2">-</b><span>部门</span></div>
    <div class="stat"><b id="s3">-</b><span>体系</span></div>
    <div class="stat"><b id="s4">-</b><span>主体</span></div>
  </div>
  <div class="spacer"></div>
  <select id="entity"><option value="">全部主体</option></select>
  <div class="search"><input id="q" placeholder="搜索姓名 / 岗位"></div>
  <div class="btns">
    <button id="btnTree">组织目录</button>
    <button id="btnAll">展开全部</button>
    <button id="btnFold">收起全部</button>
    <button id="btnFit">适应屏幕</button>
  </div>
</header>

<main>
  <aside>
    <div class="hd">组织目录</div>
    <div id="tree"></div>
    <div class="ft">点部门定位到架构图<br>点员工看档案详情</div>
  </aside>
  <div class="stage">
    <div id="chart"></div>
    <div class="drawer" id="drawer">
      <button class="close" id="dClose">×</button>
      <div class="top">
        <div class="avatar" id="dAvatar">?</div>
        <div><h3 id="dName">-</h3><div class="role" id="dRole">-</div></div>
      </div>
      <div class="kv" id="dKv"></div>
      <div class="note">演示数据，手机号已脱敏；正式接入后按角色控制可见字段。</div>
    </div>
    <div class="legend">
      <span><i style="background:#111827"></i>集团</span>
      <span><i style="background:#1E3A5F"></i>体系</span>
      <span><i style="background:#2E8B8B"></i>部门</span>
      <span><i style="background:#C7D2E0"></i>员工</span>
    </div>
    <div class="hint">滚轮缩放 · 拖拽平移 · 点部门展开/收起</div>
  </div>
</main>

<script src="assets/d3.min.js"></script>
<script src="assets/d3-flextree.js"></script>
<script src="assets/d3-org-chart.min.js"></script>
<script src="assets/data.js"></script>
<script>
(function () {
  var all = window.__ORG__.nodes;
  var stats = window.__ORG__.stats;
  document.getElementById('s1').textContent = stats.active;
  document.getElementById('s2').textContent = stats.depts;
  document.getElementById('s3').textContent = stats.systems;
  document.getElementById('s4').textContent = stats.entities;

  var inactivePaths = all.filter(function (n) { return n.inactive && n.path; }).map(function (n) { return n.path; });
  function inInactive(n) {
    var p = n.path || n.dept || '';
    return inactivePaths.some(function (x) { return p === x || p.indexOf(x + '|') === 0; });
  }
  var orgNodes = all.filter(function (n) { return n.type !== 'person' && !inInactive(n); });
  var allPersons = all.filter(function (n) { return n.type === 'person' && !inInactive(n); });
  document.getElementById('s2').textContent = orgNodes.filter(function (n) { return n.type === 'dept'; }).length;
  document.getElementById('s3').textContent = orgNodes.filter(function (n) { return n.type === 'system'; }).length;
  var entitySel = document.getElementById('entity');
  var entities = Array.from(new Set(allPersons.map(function (p) { return p.entity; }).filter(Boolean))).sort();
  entities.forEach(function (e) {
    var o = document.createElement('option'); o.value = e; o.textContent = e; entitySel.appendChild(o);
  });

  var cur = null;      // 当前数据集
  var curMap = {};
  var activeDept = '';
  var expanded = {};   // 已展开的节点 id，可同时展开多条分支
  var openPersons = {}; // 已展开人员的部门 id，只有点过该部门才显示其人员
  var overviewMode = false;
  var viewMode = '';

  /* 花名册职级：经理级 > 主管级 > 主管以下，用于部门内排序（主管在上） */
  var GRADE = { '高管级': 0, '总监级': 1, '经理级': 2, '主管级': 3, '主管以下': 4 };
  function gradeRank(p) { return GRADE[p.level] == null ? 9 : GRADE[p.level]; }

  /* 人员卡片第二行显示所属部门（花名册路径的最后一级） */
  function deptLabel(n) {
    var d = (n.dept || '').split('|').filter(Boolean);
    return d.length ? d[d.length - 1] : (n.position || '—');
  }

  /** 去掉 d3-org-chart 挂在数据上的展开状态，避免上次展开被记住 */
  function clean(list) {
    return list.map(function (n) {
      var o = {};
      Object.keys(n).forEach(function (k) { if (k.charAt(0) !== '_') o[k] = n[k]; });
      return o;
    });
  }

  function makeDataset(entity) {
    var org = clean(orgNodes).map(function (n) { n.count = 0; return n; });
    var people = clean(allPersons.filter(function (p) { return !entity || p.entity === entity; }));
    /* 同一部门内按职级排序，部门主管排在人员列表最上面 */
    people.sort(function (a, b) { return gradeRank(a) - gradeRank(b); });
    var all = org.concat(people);
    var byId = {};
    var kids = {};
    all.forEach(function (n) {
      byId[n.id] = n;
      if (n.parentId) (kids[n.parentId] = kids[n.parentId] || []).push(n);
    });
    /* 同一父级下：经理级及以上的人员排在下级部门之前，其余人员排在部门之后 */
    var nodes = [];
    (function walk(id) {
      nodes.push(byId[id]);
      var list = kids[id] || [];
      var heads = list.filter(function (k) { return k.type === 'person' && gradeRank(k) <= 2; });
      var depts = list.filter(function (k) { return k.type !== 'person'; });
      var rest = list.filter(function (k) { return k.type === 'person' && gradeRank(k) > 2; });
      heads.concat(depts, rest).forEach(function (k) { walk(k.id); });
    })('root');
    var map = {};
    nodes.forEach(function (n) { map[n.id] = n; });
    people.forEach(function (p) {
      var c = map[p.parentId];
      while (c) { c.count = (c.count || 0) + 1; c = c.parentId ? map[c.parentId] : null; }
    });
    return { nodes: nodes, map: map };
  }

  function nodeHtml(d) {
    var n = d.data;
    if (n.type === 'root') return '<div class="node n-root"><div class="k">LINK OVERSEAS</div><div class="t">' + n.name + '</div></div>';
    if (n.type === 'system' || (n.type === 'dept' && n.level === 1)) {
      return '<div class="node n-sys"><div class="t">' + n.name + '</div><div class="c">' + (n.count || 0) + ' 人</div></div>';
    }
    if (n.type === 'dept') return '<div class="node n-dept' + (n.inactive ? ' muted' : '') + '"><div class="t">' + n.name + '</div><div class="c">' + (n.count || 0) + ' 人</div></div>';
    return '<div class="node n-person">'
      + '<div class="avatar">' + (n.name || '?').slice(0, 1) + '</div>'
      + '<div class="meta"><div class="nm">' + n.name + '<span class="tag">' + (n.entity || '') + '</span></div>'
      + '<div class="ps">' + deptLabel(n) + '</div></div></div>';
  }

  var chart = new d3.OrgChart()
    .container('#chart')
    .layout('left')
    .compact(false)
    .nodeWidth(function (d) {
      var t = d.data.type;
      if (viewMode === 'overview') return t === 'root' ? 176 : 130;
      return t === 'root' ? 190 : 140;
    })
    .nodeHeight(function (d) {
      var t = d.data.type;
      if (t === 'root') return viewMode === 'overview' ? 54 : 62;
      if (t === 'person') return viewMode === 'overview' ? 42 : 48;
      return viewMode === 'overview' ? 44 : 48;
    })
    .childrenMargin(function () { return viewMode === 'overview' ? 18 : 30; })
    .siblingsMargin(function () { return viewMode === 'overview' ? 6 : 12; })
    .compactMarginBetween(function () { return viewMode === 'overview' ? 6 : 10; })
    .compactMarginPair(function () { return viewMode === 'overview' ? 10 : 16; })
    .nodeContent(nodeHtml)
    .buttonContent(function () { return ''; })
    .onNodeClick(function (d) {
      var n = d.data;
      if (n.type === 'person') { showPerson(n); return; }
      toggleNode(n.id);
    });

  /* 常规与总览共用左右布局，只改卡片尺寸 */
  function setViewMode(mode) {
    viewMode = mode;
  }

  /** 节点是否可见：体系常显，其余要求每一级父节点都已展开；人员只跟随被点开的部门 */
  function isVisible(n) {
    if (n.type === 'root') return true;
    if (n.type === 'person' && overviewMode) return false;
    var p = curMap[n.parentId];
    if (!p) return false;
    if (n.type === 'person' && !openPersons[p.id]) return false;
    if (p.type === 'root') return true;
    return !!expanded[p.id] && isVisible(p);
  }

  function renderVisible(fit) {
    var list = cur.nodes.filter(isVisible);
    chart.data(clean(list)).render().expandAll();
    try { window.scrollTo(0, 0); document.body.scrollLeft = 0; document.documentElement.scrollLeft = 0; } catch (e) { }
    if (fit) chart.fit();
  }

  /** 点卡片：展开/收起该分支，其他已展开分支保持不动 */
  function toggleNode(id) {
    var n = curMap[id];
    if (!n || n.type === 'root') return;
    overviewMode = false;
    expanded[id] = !expanded[id];
    if (n.type === 'dept') openPersons[id] = expanded[id];
    activeDept = id;
    markTree();
    renderVisible(true);
    var aside = document.querySelector('aside');
    if (aside) aside.classList.remove('open');
  }

  /** 左侧目录：展开整条路径并定位 */
  function reveal(id) {
    var c = curMap[id];
    if (!c) return;
    overviewMode = false;
    var chain = [];
    while (c) { chain.push(c); c = c.parentId ? curMap[c.parentId] : null; }
    chain.forEach(function (x) { if (x.type !== 'root' && x.type !== 'person') expanded[x.id] = true; });
    if (curMap[id].type === 'dept') openPersons[id] = true;
    activeDept = id;
    markTree();
    renderVisible(true);
    chart.setCentered(id);
    var aside = document.querySelector('aside');
    if (aside) aside.classList.remove('open');
  }

  function expandAll() {
    /* 展开到全部部门层（不含个人）；两个体系与所有中心同时展开 */
    overviewMode = true;
    expanded = {};
    openPersons = {};
    cur.nodes.forEach(function (n) {
      if (n.type === 'system' || n.level === 2) expanded[n.id] = true;
    });
    activeDept = '';
    markTree();
    renderVisible(true);
  }

  function showPerson(n) {
    document.getElementById('dAvatar').textContent = (n.name || '?').slice(0, 1);
    document.getElementById('dName').textContent = n.name;
    document.getElementById('dRole').textContent = (n.position || '—') + (n.level ? ' · ' + n.level : '');
    var rows = [
      ['所属主体', n.entity || '—'],
      ['所在部门', (n.dept || '—').replace(/\|/g, ' / ')],
      ['入职日期', n.hire || '—'],
      ['转正日期', n.regular || '—'],
      ['带教老师', n.mentor || '—'],
      ['手机', n.phone || '—']
    ];
    if (n.status === '异动') rows.push(['当前状态', '异动' + (n.move ? ' · ' + n.move : '')]);
    document.getElementById('dKv').innerHTML = rows.map(function (r) {
      return '<div class="k">' + r[0] + '</div><div>' + (r[1] || '—') + '</div>';
    }).join('');
    document.getElementById('drawer').classList.add('on');
  }
  document.getElementById('dClose').onclick = function () { document.getElementById('drawer').classList.remove('on'); };

  function renderTree() {
    var html = '';
    function walk(parentId) {
      cur.nodes.forEach(function (n) {
        if (n.parentId !== parentId || n.type === 'person') return;
        var cls = 't-item t-l' + n.level + (n.inactive ? ' t-inactive' : '') + (n.id === activeDept ? ' active' : '');
        html += '<div class="' + cls + '" data-id="' + n.id + '"><span>' + n.name + '</span><span class="c">' + (n.count || 0) + '</span></div>';
        walk(n.id);
      });
    }
    walk('root');
    var tree = document.getElementById('tree');
    tree.innerHTML = html;
    tree.querySelectorAll('[data-id]').forEach(function (el) {
      el.onclick = function () { reveal(el.dataset.id); };
    });
  }
  function markTree() {
    document.querySelectorAll('#tree .t-item').forEach(function (el) {
      el.classList.toggle('active', el.dataset.id === activeDept);
    });
  }

  function reset(entity) {
    setViewMode('normal');
    overviewMode = false;
    expanded = {};
    openPersons = {};
    cur = makeDataset(entity);
    curMap = cur.map;
    activeDept = '';
    renderTree();
    renderVisible(true);
  }

  entitySel.onchange = function () {
    document.getElementById('q').value = '';
    reset(entitySel.value);
    expandAll();
  };
  document.getElementById('btnAll').onclick = expandAll;
  document.getElementById('btnFold').onclick = function () {
    document.getElementById('q').value = '';
    reset(entitySel.value);
  };
  document.getElementById('btnFit').onclick = function () { chart.fit(); };
  document.getElementById('btnTree').onclick = function () {
    document.querySelector('aside').classList.toggle('open');
  };

  var q = document.getElementById('q');
  var timer = null;
  q.addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(function () {
      var kw = q.value.trim().toLowerCase();
      setViewMode('normal');
      overviewMode = false;
      if (!kw) { renderVisible(true); return; }
      var keep = {};
      cur.nodes.forEach(function (n) {
        if (n.type !== 'person') return;
        var hay = (n.name + ' ' + (n.position || '') + ' ' + (n.entity || '') + ' ' + (n.dept || '')).toLowerCase();
        if (hay.indexOf(kw) < 0) return;
        var c = n;
        while (c) { keep[c.id] = true; c = c.parentId ? curMap[c.parentId] : null; }
      });
      var list = cur.nodes.filter(function (x) { return keep[x.id]; });
      chart.data(clean(list.length ? list : [curMap.root])).render().expandAll().fit();
    }, 180);
  });

  reset('');
  /* 首屏默认展开到部门层；等布局尺寸稳定后再 fit，避免缩放定位错位 */
  setTimeout(expandAll, 80);
})();
</script>
</body>
</html>
