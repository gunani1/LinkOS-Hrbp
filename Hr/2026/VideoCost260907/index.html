<div id="gate"><p>视频成本演示 · 输入访问密码</p><input id="gk" type="password" placeholder="PASSWORD" autocomplete="off"/><b id="gerr"></b></div>
<script>
(function(){var P="260907";var g=document.getElementById("gate"),k=document.getElementById("gk"),e=document.getElementById("gerr");
function tryUnlock(){if(k.value===P){g.remove();sessionStorage.setItem("vc_ok","1")}else{e.textContent="密码不对"}}
k.addEventListener("keydown",function(ev){if(ev.key==="Enter")tryUnlock()});
if(sessionStorage.getItem("vc_ok")==="1"){g.remove()}else{k.focus()}})();
</script>
